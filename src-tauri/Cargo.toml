[package]
name = "kimi-rabbit-widget"
version = "0.1.0"
description = "月兔娘 Kimi Coding Plan 额度桌面挂件"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

[profile.dev]
incremental = true
